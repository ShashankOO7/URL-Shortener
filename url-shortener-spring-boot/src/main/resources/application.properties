spring.application.name=url-shortner-spring-boot
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
jwt.secret=${JWT_SECRET:266756d92934e5e5ac3f1a834e5d2a5696c4fbdfcce647af6f4b5fd1e4d4d5b7}
jwt.expiration=172800000
logging.level.org.springframework.security=DEBUG
logging.level.url.shortener=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web.servlet=TRACE
frontend.url=${FRONTEND_URL:http://localhost:5173}
# Rate Limiting (requests per minute)
rate-limit.shorten.requests=10
rate-limit.shorten.minutes=1
rate-limit.redirect.requests=60
rate-limit.redirect.minutes=1
rate-limit.login.requests=5
rate-limit.login.minutes=1
rate-limit.register.requests=3
rate-limit.register.minutes=1
